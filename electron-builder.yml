appId: 'customlauncher'
productName: 'Custom Launcher'
artifactName: 'CustomLauncher-setup-${version}.${ext}'

copyright: 'Copyright © 2026 Custom Launcher. Based on Helios Launcher by Daniel Scalzi (MIT).'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,mise.toml,eslint.config.mjs,branding,PRODUCT.md,DESIGN.md,.impeccable}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: 'CustomLauncher-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  target:
    - target: 'AppImage'
      arch: 'x64'
    - target: 'pacman'
      arch: 'x64'
    - target: 'deb'
      arch: 'x64'
    - target: 'tar.gz'
      arch: 'x64'
  maintainer: 'Custom Launcher'
  vendor: 'Custom Launcher'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'