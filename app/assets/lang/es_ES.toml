fatalErrorMessage = "No se pudo conectar con nuestros servidores para descargar el índice de distribución y no había ninguna copia local. <br><br>El índice de distribución es un archivo imprescindible con la información actualizada de los servidores; sin él, el launcher no puede iniciarse. Comprueba tu conexión a internet y vuelve a abrir la aplicación."
closeButton = "Cerrar"

[js.uibinder.validateAccount]
failedMessageTitle = "No se pudo renovar la sesión"
failedMessage = "No pudimos renovar la sesión de <strong>{account}</strong>. Selecciona otra cuenta o vuelve a iniciar sesión."
failedMessageSelectAnotherAccount = "No pudimos renovar la sesión de <strong>{account}</strong>. Vuelve a iniciar sesión."
loginButton = "Iniciar sesión"
selectAnotherAccountButton = "Seleccionar otra cuenta"

[js.uicore.autoUpdate]
checkingForUpdateButton = "Buscando actualizaciones..."
installNowButton = "Instalar ahora"
checkForUpdatesButton = "Buscar actualizaciones"
promptTitle = "La versión {version} está disponible"
promptDesc = "Salió una nueva versión del launcher. Descárgala ahora: se instala y el launcher se reinicia conservando tus ajustes, cuentas y modpacks. O más tarde: te lo volveremos a preguntar la próxima vez que abras el launcher."
promptDescMac = "Para actualizarse solo, el launcher tiene que estar en Aplicaciones. Por ahora, descarga la nueva versión de GitHub, cierra el launcher, abre el dmg y arrastra Meridian a Aplicaciones para reemplazar la anterior."
promptInstall = "Descargar e instalar"
promptDownload = "Descargar"
promptLater = "Más tarde"
downloadingTitle = "Actualizando a {version}"
downloadingDesc = "Cuando termine, el launcher se reiniciará con la nueva versión. Tus ajustes, cuentas y modpacks se quedan como están."
downloadingProgress = "Descargando… {percent} %"
installing = "Instalando…"
failedTitle = "No se pudo descargar la actualización"
failedDesc = "Comprueba tu conexión y vuelve a intentarlo en Ajustes → Acerca de, o la próxima vez que abras el launcher."
failedOk = "Aceptar"

