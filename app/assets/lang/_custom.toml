# Custom Language File for Launcher Customizer
#
# Everything brand-specific lives here. Social links left as "#" are hidden.

[ejs.app]
title = "Custom Launcher"

[ejs.landing]
brandTagline = "Modded servers"
mediaGitHubURL = "#"
mediaXURL = "#"
mediaInstagramURL = "#"
mediaYouTubeURL = "#"
mediaDiscordURL = "#"

[ejs.settings]
sourceGithubLink = "https://github.com/ildimas/Helios-Custom-Worlds"
supportLink = "https://github.com/ildimas/Helios-Custom-Worlds/issues"

[ejs.welcome]
welcomeHeader = "Welcome aboard"
welcomeDescription = "This launcher sets up everything our servers need: the right Minecraft version, the mod loader, every mod and config. When a pack updates, it updates too, so you never manage mods by hand."
welcomeDescCTA = "Sign in once, pick a server, press Play."
