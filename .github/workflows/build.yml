name: Build & Release

# Builds run only when a pull request from dev is merged into master (or by
# hand from the Actions tab, on master). Direct pushes to master, Dependabot
# PRs merged into master and pushes to dev never trigger it.
on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

env:
  # The commit that landed on master: the PR's merge commit (whatever the
  # merge method), or master's head for a manual run.
  RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  # Creates (or reuses) a draft GitHub release for the version in package.json.
  # If that version is already published, the build still runs but nothing is
  # uploaded - bump "version" in package.json to cut a new release.
  prepare:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.merged == true
        && github.event.pull_request.head.ref == 'dev'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Reusing existing draft release $TAG"
              echo "publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Release $TAG is already published - building without uploading. Bump the version in package.json to release."
              echo "publish=false" >> "$GITHUB_OUTPUT"
            fi
          else
            gh release create "$TAG" --draft --target "$RELEASE_SHA" --title "$TAG" --generate-notes
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install Dependencies
        run: npm ci
        shell: bash

      # electron-builder uploads the installers plus latest*.yml (used by the
      # in-app auto-updater) into the draft release created above.
      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder skips publishing on pull_request events. This
          # only runs for PRs from dev that are already merged into master.
          PUBLISH_FOR_PULL_REQUEST: 'true'
        shell: bash
        run: >
          npx electron-builder build
          --publish ${{ needs.prepare.outputs.publish == 'true' && 'always' || 'never' }}
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=draft

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          if-no-files-found: ignore
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.pacman
            dist/*.yml
            dist/*.blockmap

  # Only un-draft the release once every platform built successfully.
  release:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest
