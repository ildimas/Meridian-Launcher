# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# PRs go to dev; dev is merged into master to release. Dependabot reads this
# file from the default branch (master), so it applies once merged there.
# Security-fix PRs ignore target-branch and still open against master.

version: 2
updates:
  # npm packages (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Moscow"
    # One PR for all minor/patch bumps; major bumps (e.g. Electron) stay separate.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    # got 12+ is an ES module only: require('got') then gives a namespace
    # object and every request fails at run time (1.2.0). Stay on 11 until
    # the launcher loads it differently. test/dependencies.test.js guards it.
    ignore:
      - dependency-name: "got"
        versions: [">=12"]
    commit-message:
      prefix: "deps"

  # Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
